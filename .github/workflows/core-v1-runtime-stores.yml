name: Core v1 one-time durable runtime stores
on:
  push:
    branches: [implementation/core-v1]
    paths: [.github/workflows/core-v1-runtime-stores.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: implementation/core-v1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Apply reviewed runtime store archive
        shell: bash
        run: |
          base64 -d > /tmp/runtime-stores.tar.gz <<'ARCHIVE'
          
          ARCHIVE
          echo 'c2dfc62308edfcb8fa457c17340d79cc91aac9c8a58949012d4ed0a50e657ec6  /tmp/runtime-stores.tar.gz' | sha256sum -c -
          tar -xzf /tmp/runtime-stores.tar.gz
      - name: Verify exact dependency and contract gates
        run: |
          npm ci --ignore-scripts
          npm run check
          npm run inventory
      - name: Commit reviewed runtime stores and remove bootstrap workflow
        shell: bash
        run: |
          git config user.name 'ForgeStudio CI'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/core-v1-runtime-stores.yml
          git add packages/platform/node-postgres.ts workers/shared/postgres.ts workers/shared/worker.ts workers/shared/outbox.ts workers/shared/pg-stores.ts workers/shared/rabbit-worker.ts workers/outbox/main.ts infrastructure/postgres/002_runtime.sql compose.yaml workers/registry.json tests/foundation/worker-safety.test.mjs
          git diff --cached --check
          git commit -m 'feat(workers): add durable job leases recovery and outbox relays'
          git push origin HEAD:implementation/core-v1
