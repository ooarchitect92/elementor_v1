name: Core v1 one-time runtime integration fix
on:
  push:
    branches: [implementation/core-v1]
    paths: [.github/workflows/core-v1-runtime-integration-fix.yml]
permissions:
  contents: write
jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: implementation/core-v1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Recover reviewed integration archive and apply strip-only runtime fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64

          workflow = Path('.github/workflows/core-v1-runtime-integration.yml')
          text = workflow.read_text(encoding='utf-8')
          marker = "base64 -d > /tmp/runtime-ci.tar.gz <<'ARCHIVE'"
          start = text.index(marker) + len(marker)
          end = text.index('\n          ARCHIVE', start)
          payload = ''.join(line.strip() for line in text[start:end].splitlines())
          archive = base64.b64decode(payload, validate=True)
          Path('/tmp/runtime-ci.tar.gz').write_bytes(archive)
          PY
          echo '8001dafce7c4c54e8b20dbb461112290779b978b7e93526eae322665c4b97904  /tmp/runtime-ci.tar.gz' | sha256sum -c -
          tar -xzf /tmp/runtime-ci.tar.gz
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('packages/platform/node-postgres.ts'): [(
                  'class PostgresConnection implements SqlConnection {\n  constructor(private readonly client: PoolClient) {}',
                  'class PostgresConnection implements SqlConnection {\n  private readonly client: PoolClient;\n\n  constructor(client: PoolClient) {\n    this.client = client;\n  }',
              )],
              Path('workers/shared/pg-stores.ts'): [
                  (
                      'export class PgJobStore implements JobStore {\n  private readonly leaseMs: number;\n\n  constructor(\n    private readonly pool: SqlPool,\n    options: PgStoreOptions = {},\n  ) {\n    this.leaseMs = option',
                      'export class PgJobStore implements JobStore {\n  private readonly pool: SqlPool;\n  private readonly leaseMs: number;\n\n  constructor(\n    pool: SqlPool,\n    options: PgStoreOptions = {},\n  ) {\n    this.pool = pool;\n    this.leaseMs = option',
                  ),
                  (
                      'export class PgOutboxStore implements OutboxStore {\n  private readonly tenantId: string;\n  private readonly leaseMs: number;\n  private readonly maxAttempts: number;\n\n  constructor(\n    private readonly pool: SqlPool,\n    tenantId: string,\n    options: PgStoreOptions = {},\n  ) {\n    this.tenantId = uuid(tenantId);',
                      'export class PgOutboxStore implements OutboxStore {\n  private readonly pool: SqlPool;\n  private readonly tenantId: string;\n  private readonly leaseMs: number;\n  private readonly maxAttempts: number;\n\n  constructor(\n    pool: SqlPool,\n    tenantId: string,\n    options: PgStoreOptions = {},\n  ) {\n    this.pool = pool;\n    this.tenantId = uuid(tenantId);',
                  ),
              ],
          }

          for path, changes in replacements.items():
              value = path.read_text(encoding='utf-8')
              for old, new in changes:
                  if old not in value:
                      raise SystemExit(f'Expected runtime syntax was not found in {path}')
                  value = value.replace(old, new, 1)
              path.write_text(value, encoding='utf-8')
          PY
          while IFS= read -r file; do
            node --experimental-strip-types --check "$file" >/dev/null
          done < <(find packages workers -type f -name '*.ts' -print | sort)
      - name: Verify contracts and installed SDK types
        run: |
          npm ci --ignore-scripts
          npm run check
          npm run inventory
      - name: Verify real runtime against disposable infrastructure
        shell: bash
        run: |
          npm run bootstrap
          docker compose --profile analytics --profile wordpress config --quiet
          docker compose --profile analytics up -d --wait postgres redis-cache redis-control rabbitmq kafka
          npm run infra:init -- --kafka
          npm run infra:smoke -- --kafka
          npm run core:smoke
          npm run runtime:smoke
      - name: Diagnostic logs on failure
        if: failure()
        run: docker compose --profile analytics logs --tail=200 postgres redis-cache redis-control rabbitmq kafka
      - name: Remove disposable integration fixtures
        if: always()
        run: docker compose --profile analytics down -v
      - name: Commit verified integration gate and remove bootstrap workflows
        shell: bash
        run: |
          git config user.name 'ForgeStudio CI'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/core-v1-runtime-integration.yml .github/workflows/core-v1-runtime-integration-fix.yml
          git add .github/workflows/foundation.yml packages/platform/node-postgres.ts workers/shared/pg-stores.ts scripts/smoke-infrastructure.mjs scripts/smoke-runtime.mjs scripts/check-foundation.mjs workers/outbox/README.md docs/runbooks/MESSAGING_RUNTIME.md
          git diff --cached --check
          git commit -m 'test(runtime): verify durable messaging end to end'
          git push origin HEAD:implementation/core-v1
