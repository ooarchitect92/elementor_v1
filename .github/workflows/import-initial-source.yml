name: Import verified initial source snapshot

on:
  push:
    branches: [main]
    paths: [.github/workflows/import-initial-source.yml]

permissions:
  contents: write

concurrency:
  group: initial-source-import
  cancel-in-progress: false

jobs:
  import:
    if: github.repository == 'ooarchitect92/elementor_v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify and publish uploaded snapshot without executing application code
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IMPORT_REPOSITORY: ${{ github.repository }}
          IMPORT_BOOTSTRAP_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64
          import os
          import re
          import subprocess
          import tempfile
          from pathlib import Path, PurePosixPath

          REPOSITORY = 'ooarchitect92/elementor_v1'
          SOURCE = 'https://github.com/navinray12/forgestudio.git'
          SOURCE_COMMIT = '86c5b4e8a31d0b85dbd3976aecca464e6b767cb5'
          SOURCE_TREE = '98f1e45ed953b8c890208d8840ca0b1aaee9260f'
          EXPECTED_TREE = 'd9a446a79572661be4ad094522ec9dd43c092851'
          WORKFLOW = '.github/workflows/import-initial-source.yml'
          EXCLUDED = {
              'backend/create-user.ts',
              'backend/error.txt',
              'backend/ts_error.txt',
              'backend/ts_error2.txt',
              'backend/ts_errors.txt',
              'frontend/_temp_editor_diff.txt',
              'frontend/_temp_editor_diff_utf8.txt',
          }
          IGNORE = base64.b64decode(
              ''
          )
          bootstrap = os.environ['IMPORT_BOOTSTRAP_SHA']
          if os.environ['IMPORT_REPOSITORY'] != REPOSITORY or not re.fullmatch(r'[0-9a-f]{40}', bootstrap):
              raise RuntimeError('Unexpected import destination or triggering commit')

          # Fetch source data anonymously. Never run source scripts or import old history.
          clean_env = os.environ.copy()
          clean_env.pop('GH_TOKEN', None)
          clean_env.update({
              'GIT_CONFIG_NOSYSTEM': '1',
              'GIT_CONFIG_GLOBAL': '/dev/null',
              'GIT_TERMINAL_PROMPT': '0',
          })
          clean_env.pop('GIT_ASKPASS', None)
          def git(repo, *args, data=None, env=None):
              result = subprocess.run(
                  ['git', '-c', 'core.hooksPath=/dev/null', '-c', 'core.autocrlf=false', '-C', str(repo), *args],
                  input=data, stdout=subprocess.PIPE, stderr=subprocess.PIPE,
                  env=clean_env if env is None else env,
              )
              if result.returncode:
                  raise RuntimeError('Git operation failed: ' + args[0] + '\n' + result.stderr.decode('utf-8', 'replace'))
              return result.stdout

          with tempfile.TemporaryDirectory(prefix='verified-initial-import-') as temp:
              root = Path(temp)
              source = root / 'source'
              destination = root / 'destination'
              source.mkdir()
              destination.mkdir()
              git(source, 'init', '-q', '-b', 'main')
              git(source, 'fetch', '-q', '--depth=1', SOURCE, SOURCE_COMMIT)
              if git(source, 'rev-parse', 'FETCH_HEAD^{tree}').decode().strip() != SOURCE_TREE:
                  raise RuntimeError('Public source tree does not match uploaded archive history')

              git(destination, 'init', '-q', '-b', 'main')
              git(destination, 'remote', 'add', 'origin', 'https://github.com/' + REPOSITORY + '.git')
              git(destination, 'fetch', '-q', '--depth=1', 'origin', 'main')
              if git(destination, 'rev-parse', 'FETCH_HEAD').decode().strip() != bootstrap:
                  raise RuntimeError('Destination changed; refusing to overwrite another commit')
              existing = [r for r in git(destination, 'ls-tree', '-r', '-z', bootstrap).split(b'\0') if r]
              if len(existing) != 1 or existing[0].split(b'\t', 1)[1].decode() != WORKFLOW:
                  raise RuntimeError('Repository is not the expected empty import bootstrap')

              # Construct Git blobs directly, preserving the ZIP bytes, including CRLF.
              # No checkout, dependency installation, build, tests, or app execution occurs.
              index_env = dict(clean_env, GIT_INDEX_FILE=str(root / 'import.index'))
              git(destination, 'read-tree', '--empty', env=index_env)
              updates = []
              source_paths = set()
              rows = git(source, 'ls-tree', '-r', '-z', SOURCE_COMMIT).split(b'\0')
              for row in rows:
                  if not row:
                      continue
                  info, path_bytes = row.split(b'\t', 1)
                  mode, kind, sha = info.decode().split()
                  path = path_bytes.decode('utf-8')
                  source_paths.add(path)
                  if path in EXCLUDED:
                      continue
                  parsed = PurePosixPath(path)
                  if parsed.is_absolute() or '..' in parsed.parts or '.git' in parsed.parts:
                      raise RuntimeError('Unsafe source path')
                  if mode != '100644' or kind != 'blob' or path == WORKFLOW:
                      raise RuntimeError('Unexpected source entry type')
                  content = git(source, 'cat-file', 'blob', sha)
                  if path == '.gitignore':
                      content = IGNORE
                  else:
                      try:
                          content.decode('utf-8')
                          if b'\0' not in content:
                              content = content.replace(b'\n', b'\r\n')
                      except UnicodeDecodeError:
                          pass
                  blob = git(destination, 'hash-object', '-w', '--stdin', data=content).strip()
                  updates.append(b'100644 ' + blob + b'\t' + path_bytes + b'\0')
              if len(source_paths) != 404 or not EXCLUDED.issubset(source_paths) or len(updates) != 397:
                  raise RuntimeError('Source file inventory does not match uploaded ZIP')
              git(destination, 'update-index', '-z', '--index-info', data=b''.join(updates), env=index_env)
              project_tree = git(destination, 'write-tree', env=index_env).decode().strip()
              if project_tree != EXPECTED_TREE:
                  raise RuntimeError('Byte-for-byte snapshot verification failed: ' + project_tree)
              print('Verified all 397 project files. Project tree: ' + project_tree, flush=True)

              # Preserve the bootstrap workflow unchanged; it is removed separately after verification.
              workflow_info, workflow_path = existing[0].split(b'\t', 1)
              workflow_mode, workflow_kind, workflow_blob = workflow_info.split()
              git(destination, 'update-index', '-z', '--index-info',
                  data=workflow_mode + b' ' + workflow_blob + b'\t' + workflow_path + b'\0', env=index_env)
              final_tree = git(destination, 'write-tree', env=index_env).decode().strip()
              author_name = git(destination, 'show', '-s', '--format=%an', bootstrap).decode().strip()
              author_email = git(destination, 'show', '-s', '--format=%ae', bootstrap).decode().strip()
              commit_env = dict(index_env,
                  GIT_AUTHOR_NAME=author_name, GIT_AUTHOR_EMAIL=author_email,
                  GIT_COMMITTER_NAME=author_name, GIT_COMMITTER_EMAIL=author_email)
              commit = git(destination, 'commit-tree', final_tree, '-p', bootstrap,
                  data=b'Initial commit: add verified ForgeStudio frontend and backend\n\nImport 397 files from the uploaded ZIP snapshot, excluding credentials and temporary reports. No prior source history imported.\n',
                  env=commit_env).decode().strip()

              # Use the repository-scoped Actions token only for the authorized destination push.
              askpass = root / 'askpass.sh'
              askpass.write_text('#!/bin/sh\ncase "$1" in\n  *Username*) printf "%s\\n" "x-access-token" ;;\n  *Password*) printf "%s\\n" "$GH_TOKEN" ;;\n  *) exit 1 ;;\nesac\n')
              askpass.chmod(0o700)
              push_env = dict(clean_env, GIT_ASKPASS=str(askpass), GH_TOKEN=os.environ['GH_TOKEN'])
              git(destination, 'push', 'origin', commit + ':refs/heads/main', env=push_env)
              remote = git(destination, 'ls-remote', 'origin', 'refs/heads/main').decode().split()[0]
              if remote != commit:
                  raise RuntimeError('Post-push remote verification failed')
              print('Published commit: ' + commit, flush=True)
              summary = os.environ.get('GITHUB_STEP_SUMMARY')
              if summary:
                  with open(summary, 'a', encoding='utf-8') as stream:
                      stream.write('## Verified source published\n\n397 project files imported with exact ZIP bytes.\n\nProject tree: `' + project_tree + '`\n\nCommit: `' + commit + '`\n\nCredential helper, debug reports, and old Git history excluded. Application code was not executed.\n')
          PY
