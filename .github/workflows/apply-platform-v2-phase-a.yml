name: Apply platform v2 phase A

on:
  push:
    branches: [implementation/core-v1]
    paths: [.github/workflows/apply-platform-v2-phase-a.yml]

permissions:
  contents: write

concurrency:
  group: apply-platform-v2-phase-a
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: implementation/core-v1
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Verify and extract reviewed source payload
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/platform-v2/part* | base64 --decode > /tmp/platform-v2-phase-a.tar.xz
          echo '07b88d4c4d473fdf86e2bbde02075291f1ee33e2438fcd53d4c49e6fdd22356e  /tmp/platform-v2-phase-a.tar.xz' | sha256sum --check --strict
          tar -xJf /tmp/platform-v2-phase-a.tar.xz
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/platform/object-store.ts')
          source = path.read_text()
          old = '    const normalized = [...headers.entries()].map(([name, value]) => [name.toLowerCase(), value.trim().replace(/\\s+/g, " ")] as const).sort(([a], [b]) => a.localeCompare(b));'
          new = '''    const headerPairs: Array<readonly [string, string]> = [];
              headers.forEach((value, name) => {
                headerPairs.push([name.toLowerCase(), value.trim().replace(/\\s+/g, " ")] as const);
              });
              const normalized = headerPairs.sort(([a], [b]) => a.localeCompare(b));'''
          if old not in source:
              raise SystemExit('Expected Headers.entries implementation was not found')
          path.write_text(source.replace(old, new))
          PY
          test -f packages/platform/object-store.ts
          test -f packages/renderer/incremental-compiler.ts
          test -f packages/wordpress/compatibility.ts
          test -f tests/foundation/platform-v2.test.mjs
      - name: Validate platform source
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run check
      - name: Publish validated source commit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap/platform-v2
          rm -f .github/workflows/apply-platform-v2-phase-a.yml
          git config user.name 'ForgeStudio CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No source changes produced'; exit 1; }
          git commit -m 'feat(platform): add storage, compiler and reliability core'
          git push origin HEAD:implementation/core-v1
