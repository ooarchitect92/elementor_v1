name: Foundation gates
on:
  push:
    branches: [main, 'foundation/**', 'implementation/**', 'feat/**', 'fix/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: php -l wordpress-plugin/forgestudio-connect/forgestudio-connect.php && php -l wordpress-plugin/forgestudio-connect/includes/class-rest.php && php tests/foundation/wordpress.test.php
      - run: npm run inventory
  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts
      - run: npm run bootstrap
      - run: docker compose --profile analytics --profile wordpress config --quiet
      - run: docker compose --profile analytics up -d --wait postgres redis-cache redis-control rabbitmq kafka
      - run: npm run infra:init -- --kafka
      - run: npm run infra:smoke -- --kafka
      - run: npm run core:smoke
      - run: npm run runtime:smoke
      - name: Diagnostic logs on failure
        if: failure()
        run: docker compose --profile analytics logs --tail=160 postgres redis-cache redis-control rabbitmq kafka
      - name: Remove disposable CI fixtures
        if: always()
        run: docker compose --profile analytics down -v
  legacy-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix: {app: [backend, frontend]}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - run: npm ci --ignore-scripts
        working-directory: ${{ matrix.app }}
      - if: matrix.app == 'backend'
        run: npm run db:generate
        working-directory: backend
        env:
          DATABASE_URL: postgresql://localhost/forgestudio_build
      - run: npm run build
        working-directory: ${{ matrix.app }}
