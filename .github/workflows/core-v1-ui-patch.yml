name: Core v1 one-time published runtime integration

on:
  push:
    branches: [implementation/core-v1]
    paths: [.github/workflows/core-v1-ui-patch.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: implementation/core-v1
          fetch-depth: 0
      - name: Route published runtime to activated releases only
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('frontend/src/pages/published/PublishedSite.tsx')
          text = path.read_text(encoding='utf-8')
          replacements = [
            (
              'const res = await fetch(`${apiUrl}/api/websites/${websiteId}`);',
              'const res = await fetch(`${apiUrl}/api/v2/public/sites/${websiteId}`, { headers: { Accept: "application/json" } });'
            ),
            (
              'if (!res.ok) throw new Error(data?.message || "Failed to load website runtime.");',
              'if (!res.ok) throw new Error(data?.error?.message || data?.message || "Failed to load published website.");'
            ),
            (
              'const site = data.website || data;',
              '''const release = data?.release;\n                const payload = release?.payload;\n                const site = payload ? {\n                    ...payload.website,\n                    editorData: payload.editorData,\n                    customCodeSnippets: payload.customCodeSnippets || [],\n                    themeLocationRules: payload.themeLocationRules || [],\n                } : null;\n                if (!site) throw new Error("Published release payload is missing.");'''
            ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, found {count}: {old[:80]}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git rm .github/workflows/core-v1-ui-patch.yml
          git config user.name "ForgeStudio CI"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/src/pages/published/PublishedSite.tsx
          git commit -m "feat(delivery): render activated published releases only"
          git push origin HEAD:implementation/core-v1
